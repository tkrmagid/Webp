<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소프트웨어 기술 선호에 관한 설문</title>
</head>
<body>
  <header>
    <h1>설문지</h1>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    <hr>
  </header>

  <section>
    <form>
      <p>
        <label>학년</label>
        <label><input type="radio" name="grade" id="1" checked>1학년</label>
        <label><input type="radio" name="grade" id="2">2학년</label>
        <label><input type="radio" name="grade" id="3">3학년</label>
        <label><input type="radio" name="grade" id="4">4학년</label>
      </p>
      <p>
        <label>성별</label>
        <label><input type="radio" name="gender" id="male">남</label>
        <label><input type="radio" name="gender" id="female">여</label>
      </p>
      <p>
        <label>관심 분야</label>
        <select name="fav">
          <option value="1">모바일 소프트웨어</option>
          <option value="2">웹공학</option>
          <option value="3">빅데이터</option>
          <option value="4">디지털 콘텐츠 및 가상 현실</option>
        </select>
      </p>
      <p>
        <label>진로</label>
        <label><input type="checkbox" name="dev" id="1" checked>개발</label>
        <label><input type="checkbox" name="plan" id="2">기획</label>
        <label><input type="checkbox" name="busi" id="3">영업</label>
        <label><input type="checkbox" name="startup" id="4">창업</label>
      </p>
      <p>
        <label>남기고 싶은 말</label>
        <br>
        <textarea cols="50" rows="10" placeholder="글을 남겨주세요"></textarea>
      </p>
    </form>
  </section>
  
  <footer>
    <p>Copyright 2022 by Kitae</p>
  </footer>
</body>
</html>
