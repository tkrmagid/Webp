<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>윤년 판별</title>
  <script>
    function check() {
      var input = document.getElementById("year").value;
      var year = Number(input);
      var result = document.getElementById("result");

      if (isNaN(year) || year < 1 || year != Math.floor(year)) {
        result.innerHTML = "1 이상의 정수 년도를 입력하세요.";
        return;
      }

      if ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0) {
        result.innerHTML = year + "년은 윤년입니다.";
      } else {
        result.innerHTML = year + "년은 윤년이 아닙니다.";
      }
    }
  </script>
</head>

<body>
  <h3>윤년 판별</h3>
  <hr>
  <form>
    <label for="year">년도 : </label>
    <input type="number" id="year" placeholder="예: 2024">
    <input type="button" value="확인" onclick="check()">
  </form>
  <p id="result"></p>
</body>

</html>
